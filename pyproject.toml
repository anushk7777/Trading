[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indquant"
version = "0.1.0"
description = "Systematic multi-factor + ML swing trading research framework for Indian equities (NSE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
indquant = "indquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indquant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
